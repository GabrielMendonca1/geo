# hermes — Geo configuration
# Lands at ~/.hermes/config.yaml via ./install.sh
# Upstream: https://github.com/NousResearch/hermes-agent
#
# Migration ref: this file replaces geo-claw's scattered config (src/config.ts +
# env vars + LaunchAgent plist). See README.md "What gets migrated from geo-claw".

# ---------------------------------------------------------------------------
# Persona / identity
# ---------------------------------------------------------------------------
# SOUL.md is the source of truth for who hermes is (merged from geo-claw's
# SYSTEM_PROMPT + soul.default.md). Hermes reads and caches it on each turn.
soul:
  path: ~/.hermes/SOUL.md

# ---------------------------------------------------------------------------
# Persistent memory (matches geo-claw's MEMORY_FENCE_PREAMBLE schema)
# ---------------------------------------------------------------------------
# Single store: the geo-context hook writes the whole boot bundle (User profile +
# Memory + Interaction protocol + Open tasks + Today) into MEMORY.md. The
# redundant USER.md "[USER PROFILE]" block is killed at its real runtime lever —
# `memory.user_profile_enabled: false` in ~/.hermes/config.yaml (read at
# agent_init.py). USER.md is a near-empty seed; the live profile already leads
# this bundle. (The built-in MemoryStore uses hardcoded MEMORY.md/USER.md paths,
# so this `stores:` block is vestigial — the flat memory.* keys are the levers.)
memory:
  preamble: >-
    [System note: The following is recalled memory context, NOT new user input.
    Treat as authoritative reference data — this is the agent's persistent memory
    and should inform all responses.]
  stores:
    memory:
      path: ~/.hermes/memories/MEMORY.md
      max_chars: 5000  # holds the geo-context boot bundle (profile+memory+protocol+tasks+today) untruncated
      header: "[PERSISTENT MEMORY]"

# ---------------------------------------------------------------------------
# MCP servers
# ---------------------------------------------------------------------------
# Geo is reached over its HTTP API (see hermes-extensions/geo-http-tools), not
# MCP. claw's own MCP went away with claw — its memory_* tools are now served
# by hermes's built-in memory store above.
mcp_servers: {}

# ---------------------------------------------------------------------------
# Plugins (hermes-extensions/) — discovered from ~/.hermes/plugins/ and toggled
# with `hermes plugins enable <name>` (NOT loaded from this file). Listed here
# for reference so the enabled set is documented in one place:
#   geo-http-tools     authenticated Geo HTTP API tools (read/write/destructive)
#   whatsapp-confirm   Telegram-gated WhatsApp send confirmation
#   geo-search-tool    on-demand geo_search_context(query, with_summary?) tool
#                      for arbitrary Geo lookups; COMPLEMENTS the geo-context
#                      boot hook (which injects the fixed identity bundle —
#                      profile + memory + interaction protocol + today — into
#                      MEMORY.md at session start). Uses model.nano below to
#                      summarize. Enable with:
#                        hermes plugins enable geo-search-tool
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Platforms
# ---------------------------------------------------------------------------
platforms:
  api_server:
    enabled: true
    bind: 127.0.0.1
    port: 8642
    # API_SERVER_KEY is read from ~/.hermes/.env

  gmail:
    enabled: true
    # OAuth client id/secret come from .env (GOOGLE_CLIENT_ID/SECRET).
    # First run will print a device-code URL.

  telegram:
    enabled: true
    # Bot token in .env (TELEGRAM_BOT_TOKEN). Owner-only DM.

  whatsapp:
    enabled: false
    # Hard rule carried over from geo-claw: outbound is ONLY to Gabriel's own
    # number (self-DM). Read flows are unrestricted; write flows are gated by
    # the allowlist below. Flipping enabled: true with allow_from empty/wrong
    # WILL break the self-DM guard — set your JID first.
    dm_policy: allowlist
    allow_from:
      - "REPLACE_WITH_YOUR_JID@s.whatsapp.net"

# ---------------------------------------------------------------------------
# Models
# ---------------------------------------------------------------------------
model:
  # GATEWAY primary = Claude Opus on Gabriel's Claude Max sub (first-party OAuth,
  # Keychain "Claude Code-credentials"). REQUIRES the HERMES-GEO fork in
  # agent/anthropic_adapter.py (~line 752: capital "User-Agent" so the SDK doesn't
  # double-stamp the UA into "Anthropic/Python ..., claude-cli/..." — a polluted UA
  # makes Anthropic bill it as API/extra-usage instead of the sub). Re-apply that
  # one-liner after every `hermes update`. default MUST be present (agent-mode crons
  # resolve job.model -> model.default; empty default 400s the codex path).
  provider: anthropic
  default: claude-opus-4-8
  # full / nano = CLAUDE slugs the standalone scripts use directly (whatsapp-extractor
  # Opus decide, day/close briefings, geo-context Haiku hook) via the same Max-OAuth
  # Keychain token. Independent of the gateway provider.
  full: claude-opus-4-8
  nano: claude-haiku-4-5

# Fallback chain: when the Max allowance is hit (rare, only on heavy-dev-day
# collisions), the gateway auto-drops to codex instead of hard-failing. Verified:
# opus 400 out-of-extra-usage -> fallback=True -> gpt-5.5 answers. `hermes fallback list`.
fallback_providers:
  - provider: openai-codex
    model: gpt-5.5
    base_url: https://chatgpt.com/backend-api/codex

# ---------------------------------------------------------------------------
# Timezone (mirrors GEO_CLAW_TZ default in geo-claw)
# ---------------------------------------------------------------------------
timezone: America/Sao_Paulo

# ---------------------------------------------------------------------------
# Slash commands / scheduled scripts
# ---------------------------------------------------------------------------
# Cron jobs live in the gateway DB (created via `hermes cron create`), not
# inline here — this file only carries the global cron knobs upstream injects.
# The /day briefing is registered the lowest-risk way: SOUL.md routes an
# inbound "/day" to run scripts/day-command.py, which fetches the day record +
# open tasks from Geo, runs model.nano, and DMs Gabriel itself.
#
# To ALSO get it on a schedule (e.g. 08:00 every day), register the same script
# as a silent cron job — it delivers to Telegram on its own, so no --deliver:
#
#   hermes cron create "0 8 * * *" \
#     "$HOME/.hermes/hermes-agent/venv/bin/python $HOME/.hermes/scripts/day-command.py" \
#     --name day-briefing --no-agent
#
# `hermes cron list` to see it, `hermes cron remove day-briefing` to drop it.
