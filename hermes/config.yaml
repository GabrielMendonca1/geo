# hermes — Geo configuration
# Lands at ~/.hermes/config.yaml via ./install.sh
# Upstream: https://github.com/NousResearch/hermes-agent
#
# Migration ref: this file replaces geo-claw's scattered config (src/config.ts +
# env vars + LaunchAgent plist). See README.md "What gets migrated from geo-claw".

# ---------------------------------------------------------------------------
# Persona / identity
# ---------------------------------------------------------------------------
# SOUL.md is the source of truth for who hermes is (merged from geo-claw's
# SYSTEM_PROMPT + soul.default.md). Hermes reads and caches it on each turn.
soul:
  path: ~/.hermes/SOUL.md

# ---------------------------------------------------------------------------
# Persistent memory (matches geo-claw's MEMORY_FENCE_PREAMBLE schema)
# ---------------------------------------------------------------------------
# Single store: the geo-context hook writes the whole boot bundle (User profile +
# Memory + Interaction protocol + Open tasks + Today) into MEMORY.md. The
# redundant USER.md "[USER PROFILE]" block is killed at its real runtime lever —
# `memory.user_profile_enabled: false` in ~/.hermes/config.yaml (read at
# agent_init.py). USER.md is a near-empty seed; the live profile already leads
# this bundle. (The built-in MemoryStore uses hardcoded MEMORY.md/USER.md paths,
# so this `stores:` block is vestigial — the flat memory.* keys are the levers.)
memory:
  preamble: >-
    [System note: The following is recalled memory context, NOT new user input.
    Treat as authoritative reference data — this is the agent's persistent memory
    and should inform all responses.]
  stores:
    memory:
      path: ~/.hermes/memories/MEMORY.md
      max_chars: 5000  # holds the geo-context boot bundle (profile+memory+protocol+tasks+today) untruncated
      header: "[PERSISTENT MEMORY]"

# ---------------------------------------------------------------------------
# MCP servers
# ---------------------------------------------------------------------------
# Geo is reached file-natively (see hermes-extensions/geo-tools), not over MCP or
# HTTP. claw's own MCP went away with claw — its memory_* tools are now served
# by hermes's built-in memory store above.
mcp_servers: {}

# ---------------------------------------------------------------------------
# Plugins (hermes-extensions/) — discovered from ~/.hermes/plugins/ and toggled
# with `hermes plugins enable <name>` (NOT loaded from this file). Listed here
# for reference so the enabled set is documented in one place:
#   geo-tools          file-native Geo vault tools (read/write/destructive)
#   whatsapp-confirm   Telegram-gated WhatsApp send confirmation
#   geo-search-tool    on-demand geo_search_context(query, with_summary?) tool
#                      for arbitrary Geo lookups; COMPLEMENTS the geo-context
#                      boot hook (which injects the fixed identity bundle —
#                      profile + memory + interaction protocol + today — into
#                      MEMORY.md at session start). Uses model.nano below to
#                      summarize. Enable with:
#                        hermes plugins enable geo-search-tool
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Platforms
# ---------------------------------------------------------------------------
platforms:
  api_server:
    enabled: true
    bind: 127.0.0.1
    port: 8642
    # API_SERVER_KEY is read from ~/.hermes/.env

  gmail:
    enabled: true
    # OAuth client id/secret come from .env (GOOGLE_CLIENT_ID/SECRET).
    # First run will print a device-code URL.

  telegram:
    enabled: true
    # Bot token in .env (TELEGRAM_BOT_TOKEN). Owner-only DM.

  whatsapp:
    enabled: false
    # Hard rule carried over from geo-claw: outbound is ONLY to Gabriel's own
    # number (self-DM). Read flows are unrestricted; write flows are gated by
    # the allowlist below. Flipping enabled: true with allow_from empty/wrong
    # WILL break the self-DM guard — set your JID first.
    dm_policy: allowlist
    allow_from:
      - "REPLACE_WITH_YOUR_JID@s.whatsapp.net"

# ---------------------------------------------------------------------------
# Models
# ---------------------------------------------------------------------------
model:
  # GATEWAY runs on gpt-5.5 via openai-codex (native tool_calls, streaming, no
  # subprocess per hop). The chat lane is latency/tool-reliability-bound, not
  # intelligence-bound — heavy work goes to Claude via cc-dispatch workers.
  # default MUST stay non-empty: agent-mode crons resolve job.model -> model.default.
  #
  # 2026-06-15 re-evaluation (Anthropic PAUSED the Agent-SDK credit change): the old
  # "ANY tool-bearing OAuth request → 400 out-of-extra by design" wall is GONE —
  # small tool-bearing calls on the Max-sub OAuth token now return 200 (verified:
  # haiku/sonnet/opus, stop_reason=tool_use, service_tier=standard). hermes ALSO has
  # full native support: `model.provider: anthropic` opens the credential-pool gate
  # (PR #4210 is_provider_explicitly_configured) so _seed_from_singletons() seeds the
  # Keychain "Claude Code-credentials" token live; anthropic_adapter sends the Claude
  # Code identity block + anthropic-beta: oauth-2025-04-20.
  #
  # BUT switching the gateway to claude-sonnet-4-6 still 400s on real turns with
  # "You're out of extra usage" — even on a clean window where a 24-token probe 200s
  # the same instant. The Max sub's INCLUDED usage is depleted/contended on this Mac
  # (Claude Code + cc-dispatch workers + bg agents share the pool); agent-sized turns
  # (~15K sys+tools+ctx) overflow to the empty extra-usage bucket → 400. To run the
  # gateway on Claude, FUND extra usage at claude.ai/settings/usage (then flip
  # provider: anthropic / default: claude-sonnet-4-6). Until then, gpt-5.5 stays.
  # The claude-code-local `claude -p` proxy lane stays retired regardless (CLAUDE.md
  # leak per turn, regex text tool protocol, ~3-4s spawn/hop).
  provider: openai-codex
  default: gpt-5.5
  # full / nano = CLAUDE slugs the standalone scripts use directly (whatsapp-extractor
  # Opus decide, close-day briefing, geo-context Haiku hook). Those calls are
  # TOOL-FREE, so they DO bill against the included sub quota via the Max-OAuth
  # Keychain token — independent of the gateway provider.
  full: claude-opus-4-8
  nano: claude-haiku-4-5

# ---------------------------------------------------------------------------
# Timezone (mirrors GEO_CLAW_TZ default in geo-claw)
# ---------------------------------------------------------------------------
timezone: America/Sao_Paulo

# ---------------------------------------------------------------------------
# Quick commands / scheduled scripts
# ---------------------------------------------------------------------------
# Cron jobs live in ~/.hermes/cron/jobs.json (created via `hermes cron create`),
# not inline here. Live set: whatsapp-extractor (6h, no-agent) ·
# geo-morning-intention (8:30, priorities + open-todos list) ·
# geo-midday-checkin (13:00) · geo-night-reflection (22:30) ·
# geo-slipbox-tending (Sun 18:00, silent Zettelkasten maintenance).
# /day was retired 2026-06-09: the morning cron pushes the briefing, /todo
# covers on-demand pull. Quick commands run a script and relay its stdout to
# the chat — they never reach the agent. This block MUST live in the repo:
# template_config overwrites ~/.hermes/config.yaml from here.
quick_commands:
  todo:
    type: exec
    command: /Users/biel/.hermes/hermes-agent/venv/bin/python /Users/biel/.hermes/scripts/todo-command.py

# ---------------------------------------------------------------------------
# Approvals — FULL BYPASS (Gabriel runs the gateway hands-off)
# ---------------------------------------------------------------------------
# mode: "off" -> tools/approval.py early-returns approved for EVERY flagged
# command (the master switch). Quoted because bare `off` is a YAML 1.1 bool.
# cron_mode: approve -> cron jobs may run flagged commands without a human.
# mcp_reload_confirm: false -> reload MCP without a prompt.
# This block MUST live in the repo: install.sh's template_config overwrites
# ~/.hermes/config.yaml from here, so omitting it silently reverts to manual.
approvals:
  mode: "off"
  timeout: 60
  cron_mode: approve
  mcp_reload_confirm: false
  destructive_slash_confirm: false

# ---------------------------------------------------------------------------
# Per-platform tool surface (pruned 2026-06-10)
# ---------------------------------------------------------------------------
# Usage-audited over 14 days of state.db history: cut delegation (1.7K tok,
# 2 uses — delegation goes through cc-dispatch), browser (1.7K/11 tools, 11
# uses — terminal curl covers fetch), memory (its MEMORY.md writes get
# clobbered by the geo-context hook each session; durable memory = the "Memory"
# Geo block), todo (second task system competing with geo tasks), clarify/
# tts/image_gen/vision (zero-to-trace usage). 56→39 tools, ~15.8K→10.7K
# schema tokens per turn. Re-enable: hermes tools enable <toolset> --platform <p>.
# computer_use/kanban/web stay listed but register no tools (env/key-gated).
platform_toolsets:
  telegram:
  - code_execution
  - computer_use
  - cronjob
  - file
  - geo
  - geo_context
  - kanban
  - messaging
  - session_search
  - skills
  - terminal
  - web
  cron:
  - code_execution
  - computer_use
  - cronjob
  - file
  - geo
  - geo_context
  - kanban
  - messaging
  - session_search
  - skills
  - terminal
  - web
known_plugin_toolsets:
  telegram:
  - geo
  - geo_context
  cron:
  - geo
  - geo_context
