name: geo-context
description: >
  Geo context fetch (User Profile + Memory + Interaction Protocol + Today's
  block) from Gabriel's Geo data. Auto-injection is ENABLED again: this fires
  on session:start / session:reset and rewrites MEMORY.md with the fixed
  identity bundle (profile + memory + interaction protocol + today), which
  config.yaml injects into every turn. The bundle now also includes the
  Interaction Protocol block. The fetch+summarize logic is also reused behind
  the on-demand geo_search_context tool (hermes-extensions/geo-search-tool),
  which the agent calls with a query for arbitrary lookups beyond this bundle.
  The hash/TTL gating and silent no-op when Geo.app is closed still apply.
events: [session:start, session:reset]
