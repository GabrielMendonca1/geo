[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dispatch-subagent"
version = "0.1.0"
description = "MCP stdio server exposing mcp_hermes_dispatch_subagent — replaces the Swift AgentWorkspaceManager pi-spawning loop."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ARC / Geo" }]
dependencies = [
    "mcp>=1.0.0",
    "paramiko>=3.4.0",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
dispatch-subagent = "dispatch_subagent.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dispatch_subagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
