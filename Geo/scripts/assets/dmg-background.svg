<?xml version="1.0" encoding="UTF-8"?>
<svg width="660" height="400" viewBox="0 0 660 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="85%" r="70%" fx="50%" fy="85%">
      <stop offset="0%" stop-color="#0055FF" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#0033AA" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0055FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowTop" cx="50%" cy="-10%" r="60%" fx="50%" fy="-10%">
      <stop offset="0%" stop-color="#0055FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0055FF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0055FF" stop-opacity="0"/>
      <stop offset="15%" stop-color="#0055FF" stop-opacity="0.5"/>
      <stop offset="85%" stop-color="#0055FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0055FF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="lineGradV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.025"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="noise"/>
    </filter>

    <filter id="softBlur">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>

    <clipPath id="roundedBg">
      <rect width="660" height="400" rx="12" ry="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedBg)">
    <rect width="660" height="400" fill="#1A1A1C"/>

    <rect width="660" height="400" fill="url(#glow)"/>
    <rect width="660" height="400" fill="url(#glowTop)"/>

    <line x1="0" y1="80" x2="660" y2="80" stroke="url(#lineGrad1)" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="660" y2="160" stroke="url(#lineGrad1)" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="660" y2="240" stroke="url(#lineGrad1)" stroke-width="0.5"/>
    <line x1="0" y1="320" x2="660" y2="320" stroke="url(#lineGrad1)" stroke-width="0.5"/>

    <line x1="132" y1="0" x2="132" y2="400" stroke="url(#lineGradV)" stroke-width="0.5"/>
    <line x1="264" y1="0" x2="264" y2="400" stroke="url(#lineGradV)" stroke-width="0.5"/>
    <line x1="396" y1="0" x2="396" y2="400" stroke="url(#lineGradV)" stroke-width="0.5"/>
    <line x1="528" y1="0" x2="528" y2="400" stroke="url(#lineGradV)" stroke-width="0.5"/>

    <ellipse cx="330" cy="420" rx="280" ry="120" fill="#0055FF" opacity="0.04"/>
    <ellipse cx="330" cy="440" rx="200" ry="80" fill="#0055FF" opacity="0.03"/>

    <g opacity="0.04">
      <circle cx="330" cy="340" r="160" fill="none" stroke="#0055FF" stroke-width="0.6"/>
      <circle cx="330" cy="340" r="220" fill="none" stroke="#0055FF" stroke-width="0.4"/>
      <circle cx="330" cy="340" r="280" fill="none" stroke="#0055FF" stroke-width="0.3"/>
      <circle cx="330" cy="340" r="340" fill="none" stroke="#0055FF" stroke-width="0.2"/>
    </g>

    <g filter="url(#softBlur)">
      <line x1="260" y1="210" x2="390" y2="210" stroke="url(#arrowGrad)" stroke-width="1.5" stroke-linecap="round"/>
      <polyline points="380,204 392,210 380,216" fill="none" stroke="#0055FF" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <rect width="660" height="400" opacity="0.035" filter="url(#grain)"/>

    <line x1="0" y1="0" x2="660" y2="0" stroke="#ffffff" stroke-opacity="0.06" stroke-width="0.5"/>
  </g>
</svg>
